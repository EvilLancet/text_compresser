<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Обработка текста</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 650px;
            margin: 40px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        h1 { text-align: center; margin-bottom: 25px; }
        textarea {
            width: 100%;
            height: 120px;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            resize: vertical;
        }
        .char-counter {
            text-align: right;
            font-size: 13px;
            color: #666;
            margin-top: 4px;
        }
        .char-counter.over { color: #e74c3c; font-weight: bold; }
        .level-block { margin: 18px 0 10px; }
        .level-block label { display: block; margin-bottom: 8px; font-weight: bold; }
        .level-select {
            width: 100%;
            padding: 10px 12px;
            font-size: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            background: white;
            cursor: pointer;
            box-sizing: border-box;
        }
        button {
            margin-top: 12px;
            padding: 10px 24px;
            font-size: 16px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        button:hover { background: #45a049; }
        button.cancel { background: #e74c3c; }
        button.cancel:hover { background: #c0392b; }
        button.copy-btn {
            background: #3498db;
            margin-left: 8px;
            display: none;
        }
        button.copy-btn:hover { background: #2980b9; }
        button.copy-btn.visible { display: inline-block; }
        .result-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 20px;
        }
        .result-header h2 { margin: 0; }
        #result {
            margin-top: 10px;
            padding: 15px;
            background: white;
            border-radius: 6px;
            border: 1px solid #ddd;
            min-height: 60px;
            white-space: pre-wrap;
        }
        .history-section {
            margin-top: 30px;
            border: 1px solid #ccc;
            border-radius: 6px;
            background: white;
            overflow: hidden;
        }
        .history-header {
            padding: 12px 16px;
            background: #eee;
            cursor: pointer;
            font-weight: bold;
            user-select: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .history-header:hover { background: #e0e0e0; }
        .history-content {
            display: none;
            padding: 12px 16px;
            max-height: 300px;
            overflow-y: auto;
        }
        .history-content.open { display: block; }
        .history-item {
            padding: 10px 0;
            border-bottom: 1px solid #eee;
            font-size: 14px;
            cursor: pointer;
        }
        .history-item:hover { background: #f9f9f9; }
        .history-item:last-child { border-bottom: none; }
        .history-item .meta {
            color: #666;
            font-size: 12px;
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .history-item .original { color: #555; margin-bottom: 2px; }
        .history-item .compressed { color: #111; font-weight: 500; }
        .delete-item {
            background: transparent;
            color: #e74c3c;
            border: none;
            cursor: pointer;
            font-size: 12px;
            padding: 2px 6px;
            margin: 0;
        }
        .delete-item:hover { text-decoration: underline; }
        .clear-history {
            margin-top: 10px;
            padding: 6px 12px;
            font-size: 13px;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .clear-history:hover { background: #c0392b; }
    </style>
</head>
<body>
    <h1>Сжатие текста</h1>

    <textarea id="input" placeholder="Напиши текст, который нужно сжать..." maxlength="1000"></textarea>
    <div class="char-counter" id="charCounter">0 / 1000</div>

    <div class="level-block">
        <label for="compression">Уровень сжатия</label>
        <select id="compression" class="level-select">
            <option value="">Загрузка...</option>
        </select>
    </div>

    <button id="btn">Сжать</button>

    <div class="result-header">
        <h2>Результат:</h2>
        <button id="copyBtn" class="copy-btn">Копировать</button>
    </div>
    <div id="result">Здесь появится сжатый текст</div>

    <div class="history-section">
        <div class="history-header" id="historyToggle">
            <span>История сжатия</span>
            <span id="historyArrow">▼</span>
        </div>
        <div class="history-content" id="historyContent">
            <div id="historyList">Загрузка...</div>
            <button class="clear-history" id="clearHistory">Очистить историю</button>
        </div>
    </div>

    <script>
        const MAX_LENGTH = 1000;

        let levels = [];

        const levelSelect = document.getElementById("compression");
        const btn = document.getElementById("btn");
        const resultDiv = document.getElementById("result");
        const historyList = document.getElementById("historyList");
        const inputEl = document.getElementById("input");
        const charCounter = document.getElementById("charCounter");
        const copyBtn = document.getElementById("copyBtn");

        let isProcessing = false;
        let abortController = null;

        function getLevelById(id) {
            for (var i = 0; i < levels.length; i++) {
                if (levels[i].id === id) return levels[i];
            }
            return levels[0] || null;
        }


        function fillLevels(list) {
            levels = list || [];
            levelSelect.innerHTML = "";

            if (!levels.length) {
                levelSelect.innerHTML = '<option value="">Нет доступных уровней</option>';
                btn.disabled = true;
                return;
            }

            levels.forEach(function (level, index) {
                var opt = document.createElement("option");
                opt.value = level.id;
                opt.textContent = level.percent
                    ? level.name + " (" + level.percent + ")"
                    : level.name;
                if (index === 1 || level.id === "light") {
                    opt.selected = true;
                }
                levelSelect.appendChild(opt);
            });

            // если light не нашёлся — выбрать первый
            if (!levelSelect.value && levels.length) {
                levelSelect.value = levels[0].id;
            }
            btn.disabled = false;
        }

        async function loadLevels() {
            try {
                var response = await fetch("/levels");
                if (!response.ok) throw new Error("Не удалось загрузить уровни с сервера");
                var data = await response.json();

                if (data.success === false) {
                    throw new Error(data.message || "Сервер не вернул список уровней");
                }

                var items = Array.isArray(data) ? data : (data.items || data.levels || []);
                if (!items.length) throw new Error("Сервер вернул пустой список уровней");
                fillLevels(items);
            } catch (e) {
                levels = [];
                levelSelect.innerHTML = '<option value="">Не удалось загрузить уровни</option>';
                btn.disabled = true;
                resultDiv.textContent = "Не удалось загрузить список уровней с сервера. Попробуй обновить страницу.";
            }
        }


        function updateCharCounter() {
            var len = inputEl.value.length;
            charCounter.textContent = len + " / " + MAX_LENGTH;
            charCounter.classList.toggle("over", len > MAX_LENGTH);
        }

        inputEl.addEventListener("input", updateCharCounter);
        updateCharCounter();

        function showCopyButton(show) {
            copyBtn.classList.toggle("visible", show);
        }

        copyBtn.addEventListener("click", async function () {
            var text = resultDiv.textContent;
            if (!text || text === "Здесь появится сжатый текст" || text === "Ждём ответ..." || text === "Отменено") {
                return;
            }
            try {
                await navigator.clipboard.writeText(text);
                var old = copyBtn.textContent;
                copyBtn.textContent = "Скопировано!";
                setTimeout(function () { copyBtn.textContent = old; }, 1500);
            } catch (e) {
                alert("Не удалось скопировать");
            }
        });

        function escapeHtml(text) {
            return String(text)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;");
        }

        function shortText(text, max) {
            max = max || 80;
            text = String(text);
            return text.length > max ? text.slice(0, max) + "…" : text;
        }

        function levelLabel(idOrPercent) {
            var level = getLevelById(idOrPercent);
            if (level) return level.name + " (" + level.percent + ")";
            if (idOrPercent == null || idOrPercent === "") return "—";
            return String(idOrPercent);
        }

        function loadFromHistory(item) {
            inputEl.value = item.original || "";
            resultDiv.textContent = item.result || "";

            // compression — id уровня ("light", "strong", ...), percent — совместимость со старыми записями
            var key = item.compression != null ? item.compression : item.percent;
            if (getLevelById(key)) {
                levelSelect.value = key;
            } else if (levels.length) {
                levelSelect.value = levels[0].id;
            }
            updateCharCounter();
            showCopyButton(!!item.result);
        }

        function createHistoryItem(item) {
            var div = document.createElement("div");
            div.className = "history-item";
            div.dataset.id = item.id;

            div.innerHTML =
                '<div class="meta">' +
                    '<span>' + escapeHtml(item.date) + ' · ' + escapeHtml(levelLabel(item.compression != null ? item.compression : item.percent)) + '</span>' +
                    '<button class="delete-item" data-id="' + item.id + '">Удалить</button>' +
                '</div>' +
                '<div class="original">Исходный: ' + escapeHtml(shortText(item.original)) + '</div>' +
                '<div class="compressed">Результат: ' + escapeHtml(shortText(item.result)) + '</div>';

            div.addEventListener("click", function () {
                loadFromHistory(item);
            });

            div.querySelector(".delete-item").addEventListener("click", async function (e) {
                e.stopPropagation();
                await deleteHistoryItem(item.id, div);
            });

            return div;
        }

        function renderHistory(items) {
            historyList.innerHTML = "";

            if (!items || items.length === 0) {
                historyList.textContent = "Пока пусто";
                return;
            }

            items.forEach(function (item) {
                historyList.appendChild(createHistoryItem(item));
            });
        }

        function addHistoryItem(item) {
            if (historyList.textContent === "Пока пусто") {
                historyList.innerHTML = "";
            }
            historyList.prepend(createHistoryItem(item));
        }

        async function loadHistory() {
            try {
                var response = await fetch("/history");
                if (!response.ok) throw new Error("Не удалось загрузить историю");

                var data = await response.json();

                if (!data.success) {
                    historyList.textContent = "История недоступна";
                    return;
                }

                renderHistory(data.items || []);
            } catch (e) {
                historyList.textContent = "История недоступна";
            }
        }

        async function deleteHistoryItem(id, element) {
            try {
                var response = await fetch("/history/" + id, {
                    method: "DELETE"
                });

                if (!response.ok) throw new Error("Ошибка удаления");

                var data = await response.json();
                if (data.success) {
                    element.remove();
                    if (!historyList.children.length) {
                        historyList.textContent = "Пока пусто";
                    }
                } else {
                    alert("Не удалось удалить");
                }
            } catch (e) {
                alert("Ошибка: " + e.message);
            }
        }

        document.getElementById("clearHistory").addEventListener("click", async function () {
            if (!confirm("Очистить всю историю?")) return;

            try {
                var response = await fetch("/historys", {
                    method: "DELETE"
                });

                if (!response.ok) throw new Error("Ошибка очистки");

                var data = await response.json();
                if (data.success) {
                    historyList.textContent = "Пока пусто";
                } else {
                    alert("Не удалось очистить");
                }
            } catch (e) {
                alert("Ошибка: " + e.message);
            }
        });

        document.getElementById("historyToggle").addEventListener("click", function () {
            var content = document.getElementById("historyContent");
            var arrow = document.getElementById("historyArrow");
            content.classList.toggle("open");
            arrow.textContent = content.classList.contains("open") ? "▲" : "▼";
        });

        loadLevels();
        loadHistory();

        function setButtonToCancel() {
            btn.textContent = "Отменить";
            btn.classList.add("cancel");
            isProcessing = true;
        }

        function setButtonToNormal() {
            btn.textContent = "Сжать";
            btn.classList.remove("cancel");
            isProcessing = false;
            abortController = null;
        }

        btn.addEventListener("click", async function () {
            if (isProcessing) {
                if (abortController) abortController.abort();

                try {
                    await fetch("/stop", { method: "POST" });
                } catch (e) {}

                resultDiv.textContent = "Отменено";
                showCopyButton(false);
                setButtonToNormal();
                return;
            }

            var text = inputEl.value;
            var levelId = levelSelect.value;

            if (!text.trim()) {
                resultDiv.textContent = "Введи текст!";
                showCopyButton(false);
                return;
            }

            if (text.length > MAX_LENGTH) {
                resultDiv.textContent = "Текст слишком длинный (максимум " + MAX_LENGTH + " символов)";
                showCopyButton(false);
                return;
            }

            if (!levelId) {
                resultDiv.textContent = "Выбери уровень сжатия";
                showCopyButton(false);
                return;
            }

            setButtonToCancel();
            resultDiv.textContent = "Ждём ответ...";
            showCopyButton(false);
            abortController = new AbortController();

            try {
                var response = await fetch("/process", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ text: text, compression: levelId }),
                    signal: abortController.signal
                });

                if (!response.ok) throw new Error("Ошибка сервера");

                var data = await response.json();

                if (data.result === "Отменено" || data.success === false) {
                    resultDiv.textContent = data.result || "Отменено";
                    showCopyButton(false);
                } else {
                    resultDiv.textContent = data.result;
                    showCopyButton(true);

                    if (data.item) {
                        addHistoryItem(data.item);
                    }
                }

            } catch (error) {
                if (error.name === "AbortError") return;
                resultDiv.textContent = "Ошибка: " + error.message;
                showCopyButton(false);
            } finally {
                setButtonToNormal();
            }
        });
    </script>
</body>
</html>
